<style>
:root{
  --bg:#f2efef;--surface:#fff;--ink:#1a1418;--ink2:#4f454b;--muted:#7a6f75;--line:#ddd5d7;--press:#eae4e5;
  --accent:#8a3b12;--on-accent:#fff;--sev3:#d42a31;--sev2:#e35d0b;--sev1:#d19300;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#110e16;--surface:#1a1620;--ink:#efe9ee;--ink2:#b3a8b0;--muted:#83777f;--line:#2e2733;--press:#241e2a;
    --accent:#ff9a5c;--on-accent:#2a1306;--sev3:#ff5c61;--sev2:#ff8c42;--sev1:#ffc53d;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html,body{background:var(--surface)!important}
.app{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{position:fixed;inset:0;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
html.app-mode .app{bottom:auto;height:100vh;height:100lvh}
header{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;border-bottom:1px solid var(--line)}
.hd{flex:1;min-width:0}
h1{margin:0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ttl{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sw{flex:none;font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap;padding:4px 0;margin:-4px 0}
.sw:active{opacity:.6}
.state{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:21px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
#status{display:flex;align-items:center;gap:6px;max-width:100%;margin-top:5px;padding:2px 0;font-size:12.5px;font-weight:500;color:var(--muted);text-align:left}
#status i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--line)}
#status.up i{background:var(--accent)}
#status.down{color:var(--ink2)}
#status.down i{background:var(--sev2)}
#status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status svg{width:12px;height:12px;flex:none}

main{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:12px 16px}
.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px 11px 17px;box-shadow:inset 5px 0 0 var(--c,var(--muted))}
.item.l3{--c:var(--sev3)}.item.l2{--c:var(--sev2)}.item.l1{--c:var(--sev1)}.item.l0{--c:var(--line)}
.item:active{background:var(--press)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:16px;height:16px;flex:none;color:var(--muted)}
#more{align-self:flex-start;padding:4px 2px;font-size:14px;font-weight:650;color:var(--accent)}
.empty{margin:auto 0;text-align:center}
.empty b{display:block;font-size:18px}
.empty span{display:block;max-width:31ch;margin:6px auto 0;font-size:13.5px;color:var(--muted)}
.calm{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:1px dashed var(--line);border-radius:12px;padding:9px 12px;color:var(--ink2)}
.calm:active{background:var(--press)}
.calm .cl{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.has-calm .empty{margin-bottom:0}
.has-calm .calm{margin:10px 0 auto}
.panel .k2{margin-top:12px;font-size:13px;font-weight:650;color:var(--ink2)}

nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 2px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:10px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
nav button svg{width:22px;height:22px}
nav button[aria-selected="true"]{color:var(--accent)}
.badge{position:absolute;top:0;left:calc(50% + 4px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;border:2px solid var(--surface);font:700 11px/14px system-ui,-apple-system,sans-serif;letter-spacing:0;color:#fff;text-align:center}
.badge.l3{background:var(--sev3)}.badge.l2{background:var(--sev2)}.badge.l1{background:var(--sev1);color:#2a1c00}

.sheet{position:fixed;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,4,10,.55)}
.panel{width:100%;max-width:560px;max-height:86%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.panel h2{margin:0;font-size:20px;line-height:1.25}
.panel .sub{margin-top:4px;font-size:14px;color:var(--ink2)}
.panel p{margin:12px 0 0;font-size:15px;line-height:1.5;color:var(--ink2)}
.panel p.lead{color:var(--ink);font-weight:600}
.panel p.small{font-size:12.5px;color:var(--muted)}
.panel .k{margin-top:18px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.panel .cards{margin-top:14px}
.srcs{list-style:none;margin:14px 0 0;padding:0}
.srcs li{display:flex;gap:10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.srcs li:first-child{border-top:0}
.srcs i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line);transform:translateY(-1px)}
.srcs i.up{background:var(--accent)}.srcs i.down{background:var(--sev2)}
.srcs b{display:block;font-weight:650}
.srcs span{display:block;font-size:13px;color:var(--ink2)}
.row{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;display:block;text-align:center;padding:12px;border-radius:11px;border:1px solid var(--line);font-weight:650;font-size:15px;color:var(--ink);text-decoration:none}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.55;cursor:default}
.dbglink{display:block;margin:12px auto 0;padding:6px 10px;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}

  const home = baseDomain(handle);
  return j.feed.filter(x => x && x.post && !x.reason).map(x => {
    const p = x.post, r = p.record || {}, e = p.embed || {}, ext = e.external || (e.media && e.media.external) || null;
    const text = String(r.text || "").trim();
    const link = ext && /^https?:\/\//i.test(ext.uri || "") ? ext.uri : `https://bsky.app/profile/${handle}/post/${String(p.uri || "").split("/").pop()}`;
    const host = hostOf(link);
    return {title: (ext && ext.title) || text.split("\n")[0], text: [text, ext && ext.description].filter(Boolean).join(" "),
      url: link, t: Date.parse(r.createdAt || p.indexedAt || ""), dom: host === "bsky.app" ? home : host};
  });
}

/* ---------- Wikipedia Portal:Current events (today and the two days before, UTC) ---------- */
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const wikiPage = d => `Portal:Current_events/${d.getUTCFullYear()}_${MONTHS[d.getUTCMonth()]}_${d.getUTCDate()}`;
async function loadWiki(){
  const days = [0, 1, 2].map(n => new Date(Date.now() - n * 864e5));
  const pages = await Promise.all(days.map(async d => {
    const page = wikiPage(d);
    try {
      const j = await getJSON("https://en.wikipedia.org/w/api.php?" + new URLSearchParams({action: "parse", format: "json", formatversion: "2", origin: "*",
        prop: "text", disablelimitreport: "1", disableeditsection: "1", page}), 15000, "wiki:" + page.slice(-10), "default");
      if (j.error) return j.error.code === "missingtitle" ? [] : null;   // today's page may not exist yet
      return wikiEntries(j.parse && j.parse.text, page, Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 12));
    } catch (e) { return null; }
  }));
  if (pages.every(p => p === null)) throw new Error("no day page answered");
  const r = classify(pages.filter(Boolean).flat(), {src: "wiki", cutHours: 84});
  return {items: r.items, calm: r.calm, summary: r.summary, note: plural(pages.filter(Boolean).length, "day page")};
}
/* Leaf list items of a day page → records. Each keeps its topic chain (e.g. "2026 Portland protests") so places and
   protest context in a parent heading count. Sports and culture sections are skipped. */
function wikiEntries(html, page, t){
  if (!html) return [];
  const doc = new DOMParser().parseFromString(html, "text/html");
  const root = doc.querySelector(".current-events-content") || doc.body, out = [];
  let section = "";
  const own = li => [...li.childNodes].filter(n => !(n.nodeType === 1 && /^(UL|OL)$/.test(n.tagName))).map(n => n.textContent).join("").replace(/\s+/g, " ").trim();
  (function walk(el){
    for (const n of el.children){
      if (/^(UL|OL)$/.test(n.tagName)){
        n.querySelectorAll("li").forEach(li => {
          if (li.querySelector("ul,ol")) return;
          const chain = [];
          for (let p = li.parentElement && li.parentElement.closest("li"); p && root.contains(p); p = p.parentElement && p.parentElement.closest("li")) chain.unshift(own(p));
          const text = own(li).replace(/\s*\((?:[^()]|\([^()]*\))*\)\s*$/, "").trim();   // drop the trailing "(Source)"
          const ext = li.querySelector("a.external[href^='http']");
          if (text) out.push({title: text, text: chain.join(" · "), url: ext ? ext.href : "https://en.wikipedia.org/wiki/" + page, t, dom: "wikipedia.org", section,
            wiki: "https://en.wikipedia.org/wiki/" + page, srcName: ext ? outlet(hostOf(ext.href)) : ""});
        });
      } else if (n.children.length && !/^(P|B)$/.test(n.tagName) && !n.matches("[role=heading],.current-events-content-heading")) walk(n);
      else { const h = n.textContent.replace(/\s+/g, " ").trim(); if (h && h.length < 60) section = h; }
    }
  })(root);
  return out.filter(x => !/sport|arts|culture/i.test(x.section));
}

/* ---------- shared classifier: records → flagged cards, near misses and a count of plain protests ---------- */
const STOP = new Set(("says said after with from that this into over near their they them were have been will what when where about more than " +
  "police officers officer protest protests protesters protester demonstrators city state federal update updated breaking video watch live " +
  "people national guard troops curfew clashes riot arrested arrests").split(" "));
const words = t => new Set((String(t).toLowerCase().match(/[a-z]{4,}/g) || []).filter(w => !STOP.has(w)));
/* One card per place: anything flagged in the same named place within 18 hours is grouped, whatever the rule. */
function same(a, b){
  if (a.place !== "US" && a.place === b.place) return Math.abs(a.t - b.t) < 18 * 3.6e6;
  if (a.rule[0] !== b.rule[0]) return false;
  let n = 0; a.w.forEach(x => { if (b.w.has(x)) n++; });
  return n >= 2 && n / Math.max(1, Math.min(a.w.size, b.w.size)) >= 0.5;
}
const normUrl = u => u.replace(/[?#].*$/, "").replace(/\/+$/, "").replace(/^https:\/\/www\./i, "https://").toLowerCase();
const cleanTitle = t => String(t || "").replace(/\s+/g, " ").replace(/\s+\|\s+[^|]{2,60}$/, "")
  .replace(/\s+[-–—]\s+(AP News|Reuters|NPR|The New York Times|The Washington Post|NBC News|CBS News|ABC News|CNN|USA TODAY|Axios|Los Angeles Times|The Guardian|POLITICO|The Hill|ProPublica|[\w.]+\.(com|org|net))[^–—|]*$/i, "").trim();
const lbl = k => [k.rule[0], ...k.labels.filter(x => x !== k.rule[0]).map(x => x.toLowerCase())].join(" + ");
function classify(list, o){
  const kept = [], near = [], seen = new Set(), cut = Date.now() - o.cutHours * 3.6e6, isWiki = o.src === "wiki";
  let protests = 0, checked = 0;
  list.sort((a, b) => (b.t || 0) - (a.t || 0));
  for (const a of list){
    const title = cleanTitle(a.title), text = String(a.text || "");
    const url = String(a.url || "").replace(/^http:\/\//i, "https://");
    if (!title || !(a.t > cut) || !/^https:\/\//.test(url)) continue;
    const key = isWiki ? "w:" + title.slice(0, 80) : normUrl(url);
    if (seen.has(key)) continue;
    seen.add(key); checked++;
    /* News must show the escalation in its headline: summaries often mention a curfew or a crowd in passing.
       A Wikipedia entry is one sentence, so its topic heading counts too. */
    const rule = ruleFor(title) || (isWiki ? ruleFor(title + " · " + text) : null);
    const inText = !rule && !isWiki ? ruleFor(text) : null;
    let place = usPlace(title) || usPlace(text);
    /* The Insurrection Act, martial law and the National Guard are American by definition when nowhere abroad is named. */
    if (!place && rule && /insurrection act|martial law|national guard/i.test(title) && !isForeign(title + " " + text)) place = "US";
    const c = {key, title, url, t: a.t, outlets: [isWiki ? "Wikipedia" : outlet(a.dom)], wiki: a.wiki, srcName: a.srcName, ctx: isWiki ? text : ""};
    if (!rule){
      if (PROTEST.test(title) && place) protests++;
      else if (inText && place && place !== "US") near.push(Object.assign(c, {why: "Only in the summary, not the headline", rule: inText}));
      continue;
    }
    const why = whyNot(rule, title, isWiki ? "" : text, url, place);
    if (why){ near.push(Object.assign(c, {why, rule})); continue; }
    Object.assign(c, {w: words(title), rule, place});
    const dup = kept.find(k => same(k, c));
    if (dup){
      if (!dup.outlets.includes(c.outlets[0])) dup.outlets.push(c.outlets[0]);
      if (!dup.labels.includes(c.rule[0])) dup.labels.push(c.rule[0]);
      dup.n++; dup.also.push(c.title);
      if (c.rule[2] > dup.rule[2]) Object.assign(dup, {rule: c.rule, title: c.title, url: c.url, key: c.key});   // lead with the most serious report
      continue;
    }
    kept.push(Object.assign(c, {labels: [c.rule[0]], n: 1, also: []}));
  }
  const linkOf = c => isWiki ? {link: c.url, linkLabel: c.srcName ? c.srcName + " report" : "Wikipedia"} : {link: c.url, linkLabel: hostOf(c.url) === "bsky.app" ? "post" : "article"};
  const tag = isWiki ? "wiki" : "news";
  const items = kept.map(k => {
    const fresh = Date.now() - k.t < (isWiki ? 36 : 12) * 3.6e6;
    const many = k.outlets.length > 1 ? ` +${k.outlets.length - 1}` : "";
    const time = isWiki ? fmt(k.t, {month: "short", day: "numeric"}) : ago(k.t);
    return Object.assign({id: tag + ":" + k.key, tab: k.rule[1], level: fresh ? k.rule[2] : Math.min(k.rule[2], 1), time: k.t, src: tag,
      dup: k.place, labels: k.labels, title: k.title, meta: [lbl(k), k.place === "US" ? "US" : k.place, time, k.outlets[0] + many].join(" · "),
      detail: [
        {p: k.title, lead: true},
        k.ctx ? {p: "Topic: " + k.ctx} : null,
        {p: `${lbl(k)} · ${k.place === "US" ? "United States" : k.place}. ${isWiki ? "Listed on Wikipedia's current events for " + fmt(k.t, {month: "long", day: "numeric"}) : "Posted " + stamp(k.t) + " by " + join(k.outlets)}.`},
        k.also.length ? {k: `Also reported here (${k.also.length})`} : null,
        ...k.also.slice(0, 8).map(t => ({p: t})),
        {small: isWiki ? "From Wikipedia's Portal:Current events, matched by keyword. The place comes from the entry or its topic heading."
          : "Posted by national newsrooms on Bluesky, matched by keyword. The place comes from the headline or post; open it for details."}
      ].filter(Boolean)}, linkOf(k));
  });
  const calm = near.map(c => Object.assign({id: tag + "n:" + c.key, tab: c.rule[1], level: 0, time: c.t, group: "near", src: tag,
    title: c.title, meta: [c.why, c.rule[0], c.outlets[0], isWiki ? fmt(c.t, {month: "short", day: "numeric"}) : ago(c.t)].join(" · "),
    detail: [{p: c.title, lead: true}, c.ctx ? {p: "Topic: " + c.ctx} : null,
      {p: `Not flagged: ${c.why.toLowerCase()}. Matched "${c.rule[0]}". ${isWiki ? "Wikipedia, " + fmt(c.t, {month: "long", day: "numeric"}) : "Posted " + stamp(c.t) + " by " + c.outlets[0]}.`}].filter(Boolean)}, linkOf(c)));
  const by = t => calm.filter(i => i.tab === t).length;
  const chk = `${checked} ${isWiki ? (checked === 1 ? "entry" : "entries") : plural(checked, "post").replace(/^\d+ /, "")} checked`;
  const plain = protests ? `${protests} plain protest ${protests === 1 ? "story" : "stories"}` : "";
  const nm = n => n ? plural(n, "near miss", "es") : "";
  const summary = {
    now: [chk, plain, nm(near.length)].filter(Boolean).join(", "),
    clashes: [plain, nm(by("clashes"))].filter(Boolean).join(", ") || chk,
    orders: nm(by("orders")) || chk
  };
  return {items, calm, summary};
}

/* ---------- NWS / IPAWS civil alerts, nationwide ---------- */
const CIVIL_EVENTS = ["Civil Danger Warning", "Civil Emergency Message", "Local Area Emergency", "Shelter In Place Warning", "Evacuation Immediate", "Law Enforcement Warning"];
const NWS_UNREST = /curfew|\briot|civil (unrest|disturbance|disorder)|protest|demonstrat|loot|unlawful assembly|national guard|disperse/i;
async function loadNws(){
  const base = "https://api.weather.gov/alerts/active?status=actual&event=";
  let feats;
  try { feats = (await getJSON(base + encodeURIComponent(CIVIL_EVENTS.join(",")), 20000, "nws")).features; }
  catch (e) {
    if (e.message !== "HTTP 400") throw e;   // if the list form isn't accepted, ask for each kind separately
    const parts = await Promise.all(CIVIL_EVENTS.map(ev => getJSON(base + encodeURIComponent(ev), 20000, "nws:" + ev.split(" ")[0]).then(j => j.features || [])));
    feats = parts.flat();
  }
  if (!Array.isArray(feats)) throw new Error("unexpected response");
  const now = Date.now(), list = feats.map(f => f.properties || {}), replaced = new Set();
  list.forEach(p => (p.references || []).forEach(r => r && r.identifier && replaced.add(r.identifier)));
  const items = [], calm = [], seen = new Set();
  for (const p of list){
    if (p.status !== "Actual" || p.messageType === "Cancel" || replaced.has(p.id) || seen.has(p.id)) continue;
    seen.add(p.id);
    const end = Date.parse(p.ends || "") || Date.parse(p.expires || "");
    if (end && end < now) continue;
    if (!CIVIL_EVENTS.includes(p.event)) continue;
    const all = [p.headline, p.description, p.instruction].join(" "), hit = NWS_UNREST.exec(all);
    const areas = String(p.areaDesc || "").split(/;\s*/).filter(Boolean), where = areas.length > 1 ? `${areas[0]} +${areas.length - 1}` : areas[0] || "US";
    const detail = [];
    if (!hit) detail.push({p: "Not flagged: this alert doesn't mention curfews, riots, protests, looting or civil disturbance."});
    if (p.headline) detail.push({p: p.headline, lead: true});
    paras(p.description).forEach(t => detail.push({p: t}));
    const todo = paras(p.instruction);
    if (todo.length){ detail.push({k: "What to do"}); todo.forEach(t => detail.push({p: t})); }
    detail.push({small: `${p.senderName || "Issuing authority"} · issued ${stamp(Date.parse(p.sent || p.effective || ""))}${end ? " · until " + stamp(end) : ""} · ${areas.join("; ")}`});
    if (p.headline && p.headline.length <= 90) detail.unshift({p: p.event});
    const card = {id: "nws:" + p.id, tab: "alerts", level: hit ? (/Civil Danger|Shelter|Evacuation/.test(p.event) ? 3 : 2) : 0, time: Date.parse(p.sent || "") || now, src: "nws",
      title: p.headline && p.headline.length <= 90 ? p.headline : p.event, meta: [hit ? cap(hit[0].toLowerCase()) : "Not about unrest", where, end ? "until " + when(end) : ""].filter(Boolean).join(" · "),
      detail, link: "https://alerts.weather.gov/", linkLabel: "alerts.weather.gov"};
    (hit ? items : calm).push(card);
  }
  return {items, calm, summary: calm.length ? plural(calm.length, "other civil alert") + " (not unrest)" : items.length ? "" : "no civil alerts active"};
}

/* ---------- state, rendering ---------- */
const state = {tab: "now", items: {}, calm: {}, sum: {}, src: {}, busy: false, checked: 0, view: [], sheetView: []};
try { const t = localStorage.getItem(P + "tab"); if (SCOPE[t]) state.tab = t; } catch (e) {}

/* News wins over Wikipedia when both flag the same place. */
function all(){
  const news = state.items.news || [], have = new Set(news.map(i => i.dup));
  return [...news, ...(state.items.wiki || []).filter(i => !have.has(i.dup)), ...(state.items.nws || [])];
}
const forTab = tab => all().filter(i => tab === "now" || i.tab === tab).sort((a, b) => b.level - a.level || (b.time || 0) - (a.time || 0));
const inTab = (s, tab) => tab === "now" || s.tabs.includes(tab);
const calmOf = (s, tab) => (state.calm[s.key] || []).filter(i => tab === "now" || i.tab === tab);
const sumOf = (s, tab) => { const x = state.sum[s.key]; return !x ? "" : typeof x === "string" ? x : (x[tab] ?? x.now ?? ""); };
const summaryFor = tab => SOURCES.filter(s => inTab(s, tab)).map(s => { const x = sumOf(s, tab); return x && s.key === "wiki" ? "Wikipedia: " + x : x; }).filter(Boolean).join(" · ");
const known = s => !!state.src[s.key] && state.src[s.key].ok !== undefined;
const isDown = s => known(s) && !state.src[s.key].ok;
const LEVEL_COLOR = ["var(--line)", "var(--sev1)", "var(--sev2)", "var(--sev3)"];
const card = (it, i) => `<li><button class="item l${it.level}" type="button" data-i="${i}"><span class="tx"><span class="t">${esc(it.title)}</span><span class="m">${esc(it.meta)}</span></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></li>`;

function renderStatus(dn, wait){
  const n = SOURCES.length, at = state.checked ? " · " + clock(state.checked) : "";
  $("#status").className = wait ? "" : dn.length ? "down" : "up";
  $("#stext").textContent = wait ? `Checking sources… ${n - wait} of ${n}`
    : !dn.length ? `All ${n} sources up${at}`
    : dn.length === n ? `All sources down${at}`
    : `${dn.length} down: ${dn.map(s => s.short).join(", ")}${at}`;
}

function render(){
  const items = all(), top = items.reduce((m, i) => Math.max(m, i.level), 0);
  const dn = SOURCES.filter(isDown), wait = SOURCES.filter(s => !known(s)).length;
  $("#dot").style.background = items.length ? LEVEL_COLOR[top] : "var(--line)";
  $("#headline").textContent = items.length ? `${items.length} flagged` : wait ? "Checking…" : dn.length === SOURCES.length ? "No data" : "Nothing flagged";
  renderStatus(dn, wait);

  document.querySelectorAll("#tabs button").forEach(b => {
    const t = b.dataset.tab, list = forTab(t);
    b.setAttribute("aria-selected", String(t === state.tab));
    let badge = b.querySelector(".badge");
    if (t !== "now" && list.length){
      if (!badge){ badge = document.createElement("span"); b.append(badge); }
      badge.className = "badge l" + list[0].level;
      badge.textContent = list.length;
    } else if (badge) badge.remove();
  });

  const view = state.view = forTab(state.tab);
  $("#list").innerHTML = view.map(card).join("");
  const srcs = SOURCES.filter(s => inTab(s, state.tab));
  const failed = srcs.filter(isDown), waiting = srcs.some(s => !known(s));
  $("#empty").hidden = view.length > 0;
  if (!view.length){
    const none = !waiting && failed.length === srcs.length;
    $("#emptyTitle").textContent = waiting ? "Checking…" : none ? `Couldn't load ${state.tab === "now" ? "any source" : join(failed.map(s => s.name))}` : "Nothing flagged";
    $("#emptyText").textContent = waiting ? ""
      : none ? "Tap the source status at the top for details, then tap Check again."
      : failed.length ? `${cap(join(failed.map(s => s.name)))} didn't load, so this may be incomplete.`
      : SCOPE[state.tab];
  }
  const calmN = srcs.reduce((n, s) => n + calmOf(s, state.tab).length, 0), calmText = summaryFor(state.tab);
  $("#calm").hidden = !(calmN || calmText);
  $("#calmText").textContent = cap(calmText || plural(calmN, "item"));
  $("#main").classList.toggle("has-calm", !$("#calm").hidden && !view.length);
  fit();
  if (!$("#sheet").hidden && $("#panel .srcs")) openSources();
  else updateDebug();
}

function fit(){
  const main = $("#main"), more = $("#more"), cards = [...$("#list").children];
  more.hidden = true;
  let hidden = 0;
  for (let i = cards.length - 1; i > 0 && main.scrollHeight > main.clientHeight + 1; i--){
    cards[i].hidden = true; hidden++;
    more.hidden = false; more.textContent = `+${hidden} more`;
  }
}

function showSheet(html){ $("#panel").innerHTML = html; $("#sheet").hidden = false; $("#panel").scrollTop = 0; }
const closeSheet = () => { $("#sheet").hidden = true; };
const CLOSE = `<button class="btn" type="button" data-close>Close</button>`;
function openDetail(it){
  const blocks = (it.detail || []).map(b => b.k ? `<div class="k">${esc(b.k)}</div>` : b.small ? `<p class="small">${esc(b.small)}</p>` : `<p${b.lead ? ' class="lead"' : ""}>${esc(b.p)}</p>`).join("");
  const link = /^https:\/\//.test(it.link || "") ? `<a class="btn go" href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">Open ${esc(it.linkLabel || "source")}</a>` : "";
  showSheet(`<h2>${esc(it.title)}</h2><div class="sub">${esc(it.meta)}</div>${blocks}<div class="row">${link}${CLOSE}</div>`);
}
function openAll(){
  state.sheetView = state.view.slice();
  showSheet(`<h2>${esc(TITLES[state.tab])}</h2><ul class="cards">${state.sheetView.map(card).join("")}</ul><div class="row">${CLOSE}</div>`);
}
function openCalm(){
  const tab = state.tab, view = [], parts = [];
  const list = its => `<ul class="cards">${its.map(it => card(it, view.push(it) - 1)).join("")}</ul>`;
  for (const s of SOURCES.filter(s => inTab(s, tab))){
    const its = calmOf(s, tab).slice(0, 60), sum = sumOf(s, tab);
    if (!its.length && !sum) continue;
    parts.push(`<div class="k">${esc(s.label)}</div><p class="small">${sum ? esc(cap(sum)) + ". " : ""}${esc(s.rule)}</p>`);
    if (its.length) parts.push((s.key === "nws" ? "" : `<div class="k2">Near misses: matched a rule, but set aside</div>`) + list(its));
  }
  state.sheetView = view;
  showSheet(`<h2>Not flagged</h2><div class="sub">Checked, but below what gets flagged${tab === "now" ? "" : " · " + esc(TITLES[tab])}</div>${parts.join("") || "<p>Nothing checked yet.</p>"}<div class="row">${CLOSE}</div>`);
}
function openSources(){
  const rows = SOURCES.map(s => {
    const st = state.src[s.key] || {}, wait = st.busy || st.ok === undefined;
    const line = wait ? `Checking… · ${s.provider}`
      : st.ok ? `Up · ${s.provider}${st.note ? " · " + st.note : ""}`
      : `Down: ${st.err}${st.okAt ? " · last worked " + when(st.okAt) : ""} · ${s.provider}`;
    return `<li><i class="${wait ? "" : st.ok ? "up" : "down"}"></i><div><b>${esc(s.label)}</b><span>${esc(line)}</span></div></li>`;
  }).join("");
  const sub = state.busy ? "Checking now" : state.checked ? `Checked ${clock(state.checked)} · rechecks every 5 minutes while open` : "";
  const note = SOURCES.some(isDown) ? `<p class="small">A source marked down didn't answer in a usable way, usually because the provider is busy or limiting requests. The rest of the page still works, and it tries again on the next check.</p>` : "";
  showSheet(`<h2>Sources</h2><div class="sub">${esc(sub)}</div><ul class="srcs">${rows}</ul>${note}<div class="row"><button class="btn go" type="button" data-recheck${state.busy ? " disabled" : ""}>${state.busy ? "Checking…" : "Check again"}</button>${CLOSE}</div><button class="dbglink" type="button" data-debug>Debug info</button>`);
}

/* ---------- fetching (every request is noted for the debug report) ---------- */
const kb = n => n < 1024 ? n + " B" : (n / 1024).toFixed(1) + " KB";
const count = j => !j || typeof j !== "object" ? "no data" : Array.isArray(j.feed) ? j.feed.length + " posts"
  : Array.isArray(j.features) ? j.features.length + " records" : j.parse ? "page" : j.error ? "error " + j.error.code : Object.keys(j).length + " fields";
const snippet = t => String(t).replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
async function getJSON(url, ms, tag, cache){
  const t0 = Date.now(), ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), ms || 15000);
  let r, text;
  try {
    r = await fetch(url, {signal: ctl.signal, cache: cache || "no-store"});
    text = await r.text();
  } catch (e) {
    note(tag, "fetch", t0, `${e.name}: ${e.message}`);
    if (e.name === "AbortError") throw new Error("timed out");
    const code = /status code:?\s*(\d{3})/i.exec(e.message || "");
    throw new Error(!code ? "unreachable or blocked" : code[1] === "429" ? "rate limited" : "HTTP " + code[1]);
  } finally { clearTimeout(timer); }
  let j = null;
  if (!text.trim()) j = {};
  else try { j = JSON.parse(text); } catch (e) {}
  note(tag, "fetch", t0, `HTTP ${r.status} · ${r.headers.get("content-type") || "no type"} · ${kb(text.length)} · ` + (j ? count(j) : `reply "${snippet(text).slice(0, 90)}"`));
  if (!r.ok) throw new Error(r.status === 429 ? "rate limited" : "HTTP " + r.status);
  if (j) return j;
  throw new Error(`unexpected reply: "${snippet(text).slice(0, 70)}"`);
}
async function check(){
  if (state.busy) return;
  state.busy = true; dbg.checks++;
  SOURCES.forEach(s => { (state.src[s.key] || (state.src[s.key] = {})).busy = true; });
  render();
  await Promise.all(SOURCES.map(async s => {
    const st = state.src[s.key];
    try {
      const r = await s.load();
      [...r.items, ...(r.calm || [])].forEach(i => { if (!i.tab) i.tab = s.tabs[0]; });
      state.items[s.key] = r.items; state.calm[s.key] = r.calm || []; state.sum[s.key] = r.summary || "";
      Object.assign(st, {ok: true, okAt: Date.now(), err: "", note: r.note || ""});
    } catch (err) {
      Object.assign(st, {ok: false, err: err.message || "failed"});
      console.warn(s.label, err);
    }
    st.busy = false;
    render();
  }));
  state.busy = false; state.checked = Date.now();
  render();
}

/* ---------- debug report (Sources → Debug info) ---------- */
const BUILD = "2026-10-26 13:01Z";
const dbg = {log: [], errors: [], opened: Date.now(), checks: 0};
const hms = ms => new Date(ms).toLocaleTimeString("en-GB", {hour12: false});
function note(tag, kind, t0, result){
  dbg.log.push({t0, ms: Date.now() - t0, tag: tag || "-", kind, result});
  if (dbg.log.length > 100) dbg.log.shift();
  updateDebug();
}
addEventListener("error", e => { dbg.errors.push(`${hms(Date.now())} ${e.message || "error"}${e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : ""}`); if (dbg.errors.length > 20) dbg.errors.shift(); });
addEventListener("unhandledrejection", e => { dbg.errors.push(`${hms(Date.now())} unhandled: ${(e.reason && e.reason.message) || e.reason}`); });
function debugReport(){
  const app = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  let store = "ok"; try { localStorage.setItem(P + "t", "1"); localStorage.removeItem(P + "t"); } catch (e) { store = "blocked"; }
  const L = [
    `US Unrest Watch debug · build ${BUILD}`,
    `Report ${new Date().toISOString()} · opened ${hms(dbg.opened)} · checks ${dbg.checks}${state.busy ? " (one running)" : ""}`,
    `${app ? "Home-screen app" : "Browser tab"} · online ${navigator.onLine} · storage ${store} · ${location.host}${location.pathname}`,
    `Screen ${innerWidth}x${innerHeight} @${devicePixelRatio}x · ${TZ} · ${navigator.language}`,
    navigator.userAgent, "", "Sources:"
  ];
  for (const s of SOURCES){
    const x = state.src[s.key] || {};
    L.push(`  ${s.key.padEnd(5)} ${x.busy ? "checking" : x.ok === undefined ? "not yet" : x.ok ? "up" : "DOWN: " + x.err} · ${(state.items[s.key] || []).length} flagged · ${(state.calm[s.key] || []).length} not${x.okAt ? " · last ok " + hms(x.okAt) : ""}`);
  }
  L.push(`  newsroom accounts answering: ${[...news.found].join(", ") || "none yet"}`);
  if (news.missing.size) L.push(`  not on Bluesky: ${[...news.missing].join(", ")}`);
  const fl = all();
  if (fl.length){ L.push("", "Flagged:"); fl.forEach(i => L.push(`  L${i.level} ${i.src} ${i.meta} | ${i.title.slice(0, 90)}`)); }
  L.push("", "Requests (oldest first):");
  dbg.log.forEach(e => L.push(`  ${hms(e.t0)} ${e.tag.padEnd(12)} ${e.kind.padEnd(6)} ${String(e.ms).padStart(5)}ms  ${e.result}`));
  if (dbg.errors.length){ L.push("", "Page errors:"); dbg.errors.forEach(x => L.push("  " + x)); }
  return L.join("\n");
}
function openDebug(){
  showSheet(`<h2>Debug info</h2><div class="sub" id="dbgSub"></div><pre id="dbg"></pre><div class="row"><button class="btn go" type="button" data-copy>Copy</button>${CLOSE}</div>`);
  updateDebug();
}
function updateDebug(){
  const pre = document.getElementById("dbg");
  if (!pre || $("#sheet").hidden) return;
  const top = pre.scrollTop;
  pre.textContent = debugReport();
  pre.scrollTop = top;
  $("#dbgSub").textContent = state.busy ? "A check is running; the report updates as sources answer." : "Tap Copy, then paste it into the chat.";
}
async function copyDebug(btn){
  const text = debugReport();
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
    document.body.append(ta); ta.select(); ta.setSelectionRange(0, text.length);
    try { ok = document.execCommand("copy"); } catch (e2) {}
    ta.remove();
  }
  btn.textContent = ok ? "Copied" : "Couldn't copy: select the text";
  setTimeout(() => { if (btn.isConnected) btn.textContent = "Copy"; }, 2500);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const tab = e.target.closest("#tabs button");
  if (tab){ state.tab = tab.dataset.tab; try { localStorage.setItem(P + "tab", state.tab); } catch (err) {} render(); return; }
  const item = e.target.closest(".item");
  if (item){ const it = (item.closest("#panel") ? state.sheetView : state.view)[+item.dataset.i]; if (it) openDetail(it); return; }
  if (e.target.closest("#more")){ openAll(); return; }
  if (e.target.closest("#calm")){ openCalm(); return; }
  if (e.target.closest("#status")){ openSources(); return; }
  if (e.target.closest("[data-recheck]")){ check(); return; }
  if (e.target.closest("[data-debug]")){ openDebug(); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp){ copyDebug(cp); return; }
  if (e.target.closest("[data-close]") || e.target.id === "sheet") closeSheet();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
let rz;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 150); });
setInterval(() => { if (document.visibilityState === "visible") check(); }, 5 * 60e3);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - state.checked > 2 * 60e3) check();
});

render();
check();
/* A home-screen app can keep running an old copy; reload once when a newer build is published. */
(async () => {
  try {
    const html = await (await fetch(location.pathname + "?v=" + Date.now(), {cache: "no-store"})).text();
    const live = (/const BUILD = "([^"]+)"/.exec(html) || [])[1];
    if (live && live !== BUILD && sessionStorage.getItem(P + "reloaded") !== live){ sessionStorage.setItem(P + "reloaded", live); location.reload(); }
  } catch (e) {}
})();
</script>
</body>
