<style>
:root{
  --bg:#eef2f1;--surface:#fff;--ink:#0f191e;--ink2:#43535b;--muted:#6c7c84;--line:#d6dedb;--press:#e4ebe8;
  --accent:#0a6a73;--on-accent:#fff;--sev3:#d42a31;--sev2:#e35d0b;--sev1:#d19300;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0c1115;--surface:#151d22;--ink:#e8eff1;--ink2:#a5b4ba;--muted:#71838a;--line:#25333b;--press:#1d2830;
    --accent:#4cc3cc;--on-accent:#06262a;--sev3:#ff5c61;--sev2:#ff8c42;--sev1:#ffc53d;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{position:fixed;inset:0;max-width:560px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
header{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;border-bottom:1px solid var(--line)}
.hd{flex:1;min-width:0}
h1{margin:0;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.state{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:21px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
#status{display:flex;align-items:center;gap:6px;max-width:100%;margin-top:5px;padding:2px 0;font-size:12.5px;font-weight:500;color:var(--muted);text-align:left}
#status i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--line)}
#status.up i{background:var(--accent)}
#status.down{color:var(--ink2)}
#status.down i{background:var(--sev2)}
#status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status svg{width:12px;height:12px;flex:none}
#refresh{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink2)}
#refresh svg{width:18px;height:18px}
#refresh.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#refresh.spin svg{animation:none}}

main{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:12px 16px}
.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px 11px 17px;box-shadow:inset 5px 0 0 var(--c,var(--muted))}
.item.l3{--c:var(--sev3)}.item.l2{--c:var(--sev2)}.item.l1{--c:var(--sev1)}
.item:active{background:var(--press)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:16px;height:16px;flex:none;color:var(--muted)}
#more{align-self:flex-start;padding:4px 2px;font-size:14px;font-weight:650;color:var(--accent)}
.empty{margin:auto 0;text-align:center}
.empty b{display:block;font-size:18px}
.empty span{display:block;max-width:31ch;margin:6px auto 0;font-size:13.5px;color:var(--muted)}

nav{display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 2px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:10px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
nav button svg{width:22px;height:22px}
nav button[aria-selected="true"]{color:var(--accent)}
.badge{position:absolute;top:0;left:calc(50% + 4px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;border:2px solid var(--surface);font:700 11px/14px system-ui,-apple-system,sans-serif;letter-spacing:0;color:#fff;text-align:center}
.badge.l3{background:var(--sev3)}.badge.l2{background:var(--sev2)}.badge.l1{background:var(--sev1);color:#2a1c00}

.sheet{position:fixed;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,9,11,.55)}
.panel{width:100%;max-width:560px;max-height:86%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.panel h2{margin:0;font-size:20px;line-height:1.25}
.panel .sub{margin-top:4px;font-size:14px;color:var(--ink2)}
.panel p{margin:12px 0 0;font-size:15px;line-height:1.5;color:var(--ink2)}
.panel p.lead{color:var(--ink);font-weight:600}
.panel p.small{font-size:12.5px;color:var(--muted)}
.panel .k{margin-top:18px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.panel .cards{margin-top:14px}
.srcs{list-style:none;margin:14px 0 0;padding:0}
.srcs li{display:flex;gap:10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.srcs li:first-child{border-top:0}
.srcs i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line);transform:translateY(-1px)}
.srcs i.up{background:var(--accent)}.srcs i.down{background:var(--sev2)}
.srcs b{display:block;font-weight:650}
.srcs span{display:block;font-size:13px;color:var(--ink2)}
.row{display:flex;gap:8px;margin-top:20px}
.btn{flex:1;display:block;text-align:center;padding:12px;border-radius:11px;border:1px solid var(--line);font-weight:650;font-size:15px;color:var(--ink);text-decoration:none}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.55;cursor:default}
.dbglink{display:block;margin:12px auto 0;padding:6px 10px;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
#dbg{margin:12px 0 0;max-height:52vh;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hd">
      <h1>Salt Lake County Watch</h1>
      <div class="state" aria-live="polite"><i class="dot" id="dot"></i><span id="headline">Checking…</span></div>
      <button id="status" type="button" aria-label="Source status"><i></i><span id="stext">Checking sources…</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
    </div>
    <button id="refresh" type="button" aria-label="Check again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/></svg></button>
  </header>

  <main id="main">
    <ul class="cards" id="list"></ul>
    <button id="more" type="button" hidden></button>
    <div class="empty" id="empty" hidden><b id="emptyTitle"></b><span id="emptyText"></span></div>
  </main>

  <nav id="tabs" role="tablist" aria-label="Sections">
    <button type="button" role="tab" data-tab="now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/></svg>Now</button>
    <button type="button" role="tab" data-tab="safety"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.2 7.5 9.5 4.3-1.3 7.5-4.9 7.5-9.5V6L12 3z"/></svg>Safety</button>
    <button type="button" role="tab" data-tab="weather"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17.5a4.5 4.5 0 1 1 1-8.9 6 6 0 0 1 11.3 2.4A3.3 3.3 0 0 1 18.5 17.5H7z"/><path d="m12.5 13-2 3.5h3l-2 3.5"/></svg>Weather</button>
    <button type="button" role="tab" data-tab="quakes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h4l2.5-6 4 13 3-9 2 3H22"/></svg>Quakes</button>
    <button type="button" role="tab" data-tab="fire"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22c4 0 7-2.8 7-6.8 0-3.3-2-5.6-4-8.2-.8 2.3-2 3.4-3.2 3.6C12 7.4 10.8 4.6 8.6 2.8 8.5 7.6 5 9.4 5 15.2 5 19.2 8 22 12 22z"/></svg>Fire</button>
    <button type="button" role="tab" data-tab="air"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5h10.5a3 3 0 1 0-3-3M3 12.5h15a3 3 0 1 1-3 3M3 16.5h7"/></svg>Air</button>
  </nav>
</div>

<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Details"></div></div>

<script>
"use strict";
/* Everything below runs in your browser. Each source is fetched directly when the page opens,
   then every 5 minutes while it stays open. Only out-of-the-ordinary items are shown. */
const HOME = {lat: 40.7608, lon: -111.891};          // downtown Salt Lake City
const TZ = "America/Denver";
const COUNTY_SAME = "049035";                        // Salt Lake County
const ZONES = new Set(["UTZ105", "UTZ111", "UTZ478", "UTC035"]); // valley, Wasatch south of I-80, fire-weather zone, county
const RADIUS_MI = 60;
const NWS_PAGE = "https://forecast.weather.gov/showsigwx.php?warnzone=UTZ105&warncounty=UTC035&firewxzone=UTZ478&local_place1=Salt+Lake+City+UT";

const SOURCES = [
  {key: "news", tabs: ["safety"], name: "local news", short: "news", label: "Local news incidents", provider: "GDELT Project", home: "https://www.gdeltproject.org/", load: loadNews},
  {key: "nws", tabs: ["weather", "safety"], name: "NWS alerts", short: "NWS", label: "Emergency and weather alerts", provider: "National Weather Service", home: "https://www.weather.gov/slc/",
   url: () => "https://api.weather.gov/alerts/active?area=UT", parse: parseNws},
  {key: "quakes", tabs: ["quakes"], name: "earthquakes", short: "quakes", label: "Earthquakes", provider: "USGS", home: "https://earthquake.usgs.gov/", url: quakeUrl, parse: parseQuakes},
  {key: "fire", tabs: ["fire"], name: "wildfires", short: "fires", label: "Wildfires", provider: "NIFC (WFIGS)", home: "https://utahfireinfo.gov/", url: fireUrl, parse: parseFires},
  {key: "air", tabs: ["air"], name: "air quality", short: "air", label: "Air quality", provider: "Open-Meteo (CAMS model)", home: "https://air.utah.gov/", url: airUrl, parse: parseAir},
  {key: "space", tabs: ["weather"], name: "space weather", short: "space", label: "Space weather", provider: "NOAA SWPC", home: "https://www.swpc.noaa.gov/",
   url: () => "https://services.swpc.noaa.gov/products/noaa-scales.json", parse: parseSpace}
];
const SCOPE = {
  now: "Watching public-safety incidents, emergency and weather alerts, earthquakes, wildfires, air quality and space weather.",
  safety: "Watching local news for shootings, standoffs, lockdowns, evacuations, hazmat and protests in the last 36 hours, plus emergency alerts.",
  weather: "Watching NWS warnings, watches and advisories for the county, and strong space weather.",
  quakes: "Watching for magnitude 2.5+ within 60 miles over the past 7 days.",
  fire: "Watching for active wildfires within 60 miles.",
  air: "Watching for unhealthy air now or in the next 24 hours."
};
const TITLES = {now: "Everything flagged", safety: "Public safety", weather: "Weather", quakes: "Earthquakes", fire: "Wildfires", air: "Air quality"};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const ESC = {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"};
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ESC[c]);
const fmt = (ms, o) => isFinite(ms) ? new Intl.DateTimeFormat("en-US", Object.assign({timeZone: TZ}, o)).format(new Date(ms)) : "";

/* ---------- Local news: human-caused incidents (GDELT, last 36 hours) ---------- */
const NEWS_PLACES = ['"Salt Lake"', '"West Valley"', '"West Jordan"', '"South Jordan"', "Taylorsville", "Millcreek", "Herriman",
  '"Cottonwood Heights"', "Holladay", "Midvale", "Kearns", "Magna", "Draper", "Murray", "Sandy", "Riverton"];
const NEWS_TERMS = ["shooting", "gunfire", "stabbing", "stabbed", "homicide", "murder", "standoff", "barricaded", "lockdown",
  "evacuation", "evacuated", '"bomb threat"', "explosion", "hazmat", "protest", "kidnapping", "abducted", '"Amber Alert"', "carjacking", "manhunt"];
const NEWS_SITES = ["ksl.com", "kslnewsradio.com", "fox13now.com", "kutv.com", "abc4.com", "sltrib.com", "deseret.com", "gephardtdaily.com", "utahnewsdispatch.com", "kuer.org"];
const NEWS_QUERY = {
  // Newest stories from Salt Lake newsrooms, with no keywords: light for GDELT. Incidents are matched by headline on the phone.
  sites: `(${NEWS_SITES.map(d => "domain:" + d).join(" OR ")})`,
  // Any outlet naming a county place plus an incident word: used if GDELT rejects the first query
  places: `(${NEWS_PLACES.join(" OR ")}) (${NEWS_TERMS.join(" OR ")})`,
  // Newsrooms plus incident words: kept only for the debug test (it took GDELT ~9.5 s and failed on a phone)
  local: `(${NEWS_SITES.map(d => "domain:" + d).join(" OR ")}) (${NEWS_TERMS.join(" OR ")})`
};
let newsMode = "sites", gdeltAt = 0, gdeltScript = false, gdeltQueue = Promise.resolve();
const sleep = ms => new Promise(r => setTimeout(r, ms));
const gdeltUrl = (q, format, max) => "https://api.gdeltproject.org/api/v2/doc/doc?query=" + encodeURIComponent(q) +
  `&mode=artlist&format=${format}&maxrecords=${max || 250}&timespan=36h&sort=DateDesc`;
/* GDELT allows one request every 5 seconds. Every GDELT request waits its turn here, so they never overlap. */
function gdeltTurn(){
  const turn = gdeltQueue.then(async () => { const w = gdeltAt + 5500 - Date.now(); if (w > 0) await sleep(w); gdeltAt = Date.now(); });
  gdeltQueue = turn.catch(() => {});

}
async function gdelt(mode){
  const q = NEWS_QUERY[mode], tag = "news/" + mode;

  try { return await getJSON(gdeltUrl(q, "json"), 25000, tag); }
  catch (e) {
    if (!/^(unreachable|rate limited|HTTP 5)/.test(e.message)) throw e;
    // The browser couldn't read GDELT's reply, or GDELT was busy. Wait out the limit and ask once more in
    // GDELT's script format (JSONP), which doesn't depend on the header that lets pages read a reply.
    await gdeltTurn();
    try { const j = await jsonp(gdeltUrl(q, "jsonp"), 25000, tag); gdeltScript = true; return j; }
    catch (e2) { throw e.message === "unreachable or blocked" ? e2 : e; }

    newsMode = "places";   // rejected or empty (ten newsrooms always publish something in 36 hours), so switch for this visit
  }

}
/* First matching rule wins: [label, headline pattern, level while fresh]. */
const NEWS_RULES = [

  ["Child abduction", /amber alert|abduct|kidnap/i, 2],
  ["Explosive threat", /\bbomb\b(?!\s+cyclone)|explosive device|suspicious (package|device|item)/i, 2],
  ["Manhunt", /manhunt|still at large|remains at large|on the run/i, 2],
  ["Police standoff", /standoff|barricad|\bswat\b/i, 2],
  ["Lockdown", /lockdown|locked down|lock-down|shelter[- ]in[- ]place|hold[- ]in[- ]place/i, 2],
  ["Evacuation", /evacuat/i, 2],
  ["Hazmat", /hazmat|hazardous material|chemical (leak|spill)|gas leak/i, 2],
  ["Explosion", /explosion|exploded/i, 2],
  ["Police shooting", /officer-involved|police shooting|officers? shot|shot by police/i, 1],
  ["Shooting", /shooting|shots fired|gunfire|gunman|fatally shot|shot and killed|shot dead|\b(was|were|is|gets|man|woman|teen|boy|girl|person|people|\d+) shot\b/i, 1],
  ["Stabbing", /stabb/i, 1],
  ["Homicide", /homicide|murder|slain|manslaughter/i, 1],
  ["Robbery", /carjack|armed robbery/i, 1],
  ["Protest", /protest|demonstrators|\briot|unrest/i, 1]
];
const SL_PLACES = ["Salt Lake City", "Salt Lake County", "South Salt Lake", "West Valley City", "West Valley", "West Jordan", "South Jordan",
  "Taylorsville", "Millcreek", "Herriman", "Cottonwood Heights", "Holladay", "Midvale", "Bluffdale", "Riverton", "Draper", "Murray",
  "Kearns", "Magna", "Sandy", "Copperton", "Emigration Canyon", "Big Cottonwood", "Little Cottonwood", "Alta",
  "Rose Park", "Sugar House", "University of Utah", "Salt Lake"];
const PLACE_SRC = "\\b(" + [...SL_PLACES].sort((a, b) => b.length - a.length).map(p => p.replace(/ /g, "\\s+")).join("|") + ")\\b(?!\\s+Hook)";
const PLACE_RE = new RegExp(PLACE_SRC, "i"), PLACE_ALL = new RegExp(PLACE_SRC, "gi");
const GENERIC = new Set(["Salt Lake City", "Salt Lake County", "Salt Lake"]);
/* Headlines without a county place name are kept only from local outlets, and only if they name nowhere else. */
const OTHER_UT = /\b(Ogden|Provo|Orem|Lehi|St\.? George|Logan|Layton|Bountiful|Kaysville|Clearfield|Roy|Tooele|Park City|Heber|Spanish Fork|American Fork|Pleasant Grove|Eagle Mountain|Saratoga Springs|Springville|Payson|Cedar City|Moab|Vernal|Price|Richfield|Riverdale|Syracuse|Farmington|Centerville|Brigham City|Kamas|Weber County|Davis County|Utah County|Washington County|Cache County|Summit County|Tooele County|Box Elder|Iron County|Uintah)\b/i;
const ELSEWHERE = /\b(Alabama|Alaska|Arizona|Arkansas|California|Colorado|Connecticut|Delaware|Florida|Georgia|Hawaii|Idaho|Illinois|Indiana|Iowa|Kansas|Kentucky|Louisiana|Maine|Maryland|Massachusetts|Michigan|Minnesota|Mississippi|Missouri|Montana|Nebraska|Nevada|New Hampshire|New Jersey|New Mexico|New York|North Carolina|North Dakota|Ohio|Oklahoma|Oregon|Pennsylvania|Rhode Island|South Carolina|South Dakota|Tennessee|Texas|Vermont|Virginia|Wisconsin|Wyoming|Chicago|Los Angeles|Denver|Phoenix|Las Vegas|Boise|Seattle|Houston|Dallas|Atlanta|Miami|Philadelphia|Boston|Minneapolis|Detroit|nationwide|Israel|Gaza|Ukraine|Russia|Mexico|Canada|China|Iran|Syria|Germany|France|London|Britain|Europe)\b/i;
/* Sports, entertainment, court and legislative stories aren't live incidents. */
const NOT_LIVE = /\b(Jazz|Utes|BYU|Cougars|Mammoth|RSL|Real Salt Lake|Royals|Bees|NBA|WNBA|NFL|NHL|MLS|basketball|football|hockey|soccer|baseball|playoffs?|season|coach|quarterback|film|movie|obituary|sentenced|sentencing|trial|convicted|pleads?|pleaded|guilty|jury|verdict|parole|cold case|anniversary|years? (ago|after|later)|lawsuit|sues|settlement|lawmakers|legislat\w*)\b/i;
const SKIP_PATH = /\/(sports|opinion|entertainment|lifestyle|national-news|national|nation-world|nation|world|us-world|u-s-world|international)\//i;
const OUTLETS = {"ksl.com": "KSL", "ksltv.com": "KSL TV", "kslnewsradio.com": "KSL NewsRadio", "sltrib.com": "Salt Lake Tribune", "deseret.com": "Deseret News",
  "fox13now.com": "FOX 13", "kutv.com": "KUTV", "abc4.com": "ABC4", "gephardtdaily.com": "Gephardt Daily", "utahnewsdispatch.com": "Utah News Dispatch",
  "kuer.org": "KUER", "cityweekly.net": "City Weekly", "standard.net": "Standard-Examiner", "heraldextra.com": "Daily Herald"};
const LOCAL = Object.keys(OUTLETS);
const localKey = d => LOCAL.find(x => d === x || d.endsWith("." + x));
const outlet = d => { const k = localKey(d); return k ? OUTLETS[k] : d.replace(/^www\./, ""); };
const cleanTitle = t => String(t || "").replace(/\s+/g, " ").replace(/\s+\|\s+[^|]{2,60}$/, "")
  .replace(/\s+[-–—]\s+(KSL|Deseret|The Salt Lake Tribune|Salt Lake Tribune|FOX ?13|KUTV|ABC ?4|Gephardt|KUER|City Weekly|Standard-Examiner|Daily Herald|Utah News Dispatch|[\w.]+\.(com|org|net))[^–—|]*$/i, "").trim();
function placeIn(t){
  const m = PLACE_RE.exec(t), k = m ? m[1].replace(/\s+/g, " ").toLowerCase() : "";
  return m ? SL_PLACES.find(p => p.toLowerCase() === k) || m[1] : "";
}
const STOP = new Set(("says said after with from that this into over near their they them were have been will what when where about more than " +
  "police officers officer utah county city update updated breaking video watch live shot shooting killed dead dies died death injured hurt " +
  "suspect suspects arrested arrest investigate investigating investigation").split(" "));
const words = t => new Set((t.replace(PLACE_ALL, " ").toLowerCase().match(/[a-z]{4,}/g) || []).filter(w => !STOP.has(w)));
/* Two headlines describe the same incident if they share a category and either the same town within 12 hours or most distinctive words. */
function same(a, b){
  if (a.rule !== b.rule) return false;
  const specific = p => p && !GENERIC.has(p);
  if (specific(a.place) && specific(b.place)) return a.place === b.place && Math.abs(a.t - b.t) < 12 * 3.6e6;
  let n = 0; a.w.forEach(x => { if (b.w.has(x)) n++; });
  return n >= 2 && n / Math.max(1, Math.min(a.w.size, b.w.size)) >= 0.5;

function gdeltTime(s){
  const m = /^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)Z$/.exec(s || "");
  return m ? Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]) : NaN;
}
function parseNews(j){
  if (!j || typeof j !== "object") throw new Error("unexpected response");
  const kept = [];
  for (const a of Array.isArray(j.articles) ? j.articles : []){
    const title = cleanTitle(a.title);
    const url = String(a.url || "").replace(/^http:\/\//i, "https://"), dom = String(a.domain || "").toLowerCase();
    if (!title || !/^https:\/\//.test(url) || SKIP_PATH.test(url) || NOT_LIVE.test(title)) continue;
    const rule = NEWS_RULES.find(r => r[1].test(title));
    if (!rule) continue;
    const place = placeIn(title);
    if (!place && (!localKey(dom) || OTHER_UT.test(title) || ELSEWHERE.test(title))) continue;
    const c = {title, url, t: gdeltTime(a.seendate), w: words(title), rule, place, outlets: [outlet(dom)]};
    const dup = kept.find(k => same(k, c));
    if (dup){ if (!dup.outlets.includes(c.outlets[0])) dup.outlets.push(c.outlets[0]); continue; }
    kept.push(c);
  }
  return kept.map(k => {
    const fresh = Date.now() - k.t < 12 * 3.6e6;
    const more = k.outlets.length > 1 ? ` +${k.outlets.length - 1}` : "";
    return {id: "news:" + k.url, tab: "safety", level: fresh ? k.rule[2] : 1, time: k.t,
      title: k.title, meta: [k.rule[0], k.place || "Utah", isFinite(k.t) ? ago(k.t) : "", k.outlets[0] + more].filter(Boolean).join(" · "),
      detail: [
        {p: k.title, lead: true},
        {p: `${k.rule[0]}${k.place ? " · " + k.place : ""}. Reported ${isFinite(k.t) ? stamp(k.t) : "recently"} by ${join(k.outlets)}.`},
        {small: "Headlines from local news outlets matched by keyword through the GDELT Project. The location shown comes from the headline; open the article for details."}
      ], link: k.url, linkLabel: "article"};

}

/* ---------- NWS alerts (emergency messages go to Safety, the rest to Weather) ---------- */
const CIVIL = /Civil|Law Enforcement|Shelter In Place|Evacuation|Hazardous Materials|Child Abduction|Blue Alert|911 Telephone|Local Area Emergency|Radiological|Nuclear/i;
const CRITICAL = /Emergency|Evacuation|Shelter In Place|Civil Danger|Hazardous Materials|Law Enforcement|Radiological|Nuclear|Child Abduction|Blue Alert|Tornado Warning/i;
function nwsLevel(p){
  if (p.severity === "Extreme" || CRITICAL.test(p.event || "")) return 3;
  return /Warning/i.test(p.event || "") ? 2 : 1;
}
function coverage(ugc){
  if (ugc.has("UTC035")) return "Salt Lake County";
  const v = ugc.has("UTZ105") || ugc.has("UTZ478"), m = ugc.has("UTZ111") || ugc.has("UTZ110");
  return v && m ? "Valley and mountains" : v ? "Salt Lake Valley" : m ? "Wasatch Mountains" : "Salt Lake County";
}
function timing(p){
  const now = Date.now(), on = Date.parse(p.onset || p.effective || ""), end = Date.parse(p.ends || "") || Date.parse(p.expires || "");
  if (on > now + 60e3) return `From ${when(on)}` + (end ? ` to ${when(end)}` : "");
  return end ? `Until ${when(end)}` : "In effect";
}
function parseNws(j){
  if (!j || !Array.isArray(j.features)) throw new Error("unexpected response");
  const now = Date.now(), list = j.features.map(f => f.properties || {});
  const replaced = new Set();
  list.forEach(p => (p.references || []).forEach(r => r && r.identifier && replaced.add(r.identifier)));
  const groups = new Map();
  for (const p of list){
    if (p.status !== "Actual" || p.messageType === "Cancel" || replaced.has(p.id)) continue;
    const g = p.geocode || {}, ugc = g.UGC || [];
    if (!((g.SAME || []).includes(COUNTY_SAME) || ugc.some(z => ZONES.has(z)))) continue;
    const end = Date.parse(p.ends || "") || Date.parse(p.expires || "");
    if (end && end < now) continue;
    const key = (p.event || "") + "|" + (p.ends || p.expires || "");
    const prev = groups.get(key);
    if (prev) ugc.forEach(z => prev.ugc.add(z));
    else groups.set(key, {p, ugc: new Set(ugc)});
  }
  return [...groups.values()].map(({p, ugc}) => {
    const detail = [];
    if (p.headline) detail.push({p: p.headline, lead: true});
    paras(p.description).forEach(t => detail.push({p: t}));
    const todo = paras(p.instruction);
    if (todo.length){ detail.push({k: "What to do"}); todo.forEach(t => detail.push({p: t})); }
    detail.push({small: `${p.senderName || "National Weather Service"} · issued ${stamp(Date.parse(p.sent || p.effective || ""))}`});
    return {id: "nws:" + p.id, tab: CIVIL.test(p.event || "") ? "safety" : "weather", level: nwsLevel(p),
      time: Date.parse(p.onset || p.sent || "") || now,
      title: p.event || "Alert", meta: `${timing(p)} · ${coverage(ugc)}`, detail, link: NWS_PAGE, linkLabel: "weather.gov"};
  });
}

/* ---------- NOAA space weather: only strong events ---------- */
const SW_NAME = {G: "geomagnetic storm", R: "radio blackout", S: "solar radiation storm"};
const SW_EFFECT = {
  G: "Strong geomagnetic storms can disrupt GPS accuracy, HF radio and power-grid operations.",
  R: "Radio blackouts degrade HF radio and GPS on the sunlit side of Earth.",
  S: "Solar radiation storms raise risk for satellites and high-altitude flights and degrade HF radio near the poles."
};
function parseSpace(j){
  if (!j || !j["0"]) throw new Error("unexpected response");
  const sc = (d, k) => Number(((d || {})[k] || {}).Scale) || 0, out = [], now = Date.now();
  const cur = {G: sc(j["0"], "G"), R: sc(j["0"], "R"), S: sc(j["0"], "S")};
  for (const k of ["G", "R", "S"]){
    if (cur[k] < 2) continue;
    out.push({id: "sw:" + k, level: cur[k] >= 4 ? 3 : cur[k] >= 3 ? 2 : 1, time: now,
      title: `${k}${cur[k]} ${SW_NAME[k]} under way`, meta: "NOAA Space Weather Prediction Center",
      detail: [{p: SW_EFFECT[k]}], link: "https://www.swpc.noaa.gov/", linkLabel: "NOAA SWPC"});
  }
  let fg = 0, fd = "";
  for (const k of ["1", "2", "3"]){ const g = sc(j[k], "G"); if (g > fg){ fg = g; fd = (j[k] || {}).DateStamp || ""; } }
  if (fg >= 3 && fg > cur.G){
    out.push({id: "sw:fG", level: fg >= 4 ? 2 : 1, time: now, title: `G${fg} geomagnetic storm forecast`,
      meta: `${fd ? fmt(Date.parse(fd + "T18:00:00Z"), {weekday: "long"}) : "Next 3 days"} · NOAA SWPC`,
      detail: [{p: SW_EFFECT.G}], link: "https://www.swpc.noaa.gov/", linkLabel: "NOAA SWPC"});
  }
  return out;
}

/* ---------- USGS earthquakes ---------- */
function quakeUrl(){
  const start = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 19);
  return "https://earthquake.usgs.gov/fdsnws/event/1/query?" + new URLSearchParams({
    format: "geojson", latitude: HOME.lat, longitude: HOME.lon, maxradiuskm: "97",
    minmagnitude: "2.5", eventtype: "earthquake", orderby: "time", starttime: start});
}
function parseQuakes(j){
  if (!j || !Array.isArray(j.features)) throw new Error("unexpected response");
  return j.features.map(f => {
    const p = f.properties || {}, c = (f.geometry || {}).coordinates || [];
    if (p.mag == null || c.length < 2) return null;
    const m = Number(p.mag), near = String(p.place || "").replace(/, Utah$/, "").replace(/^.* of /, "");
    const depth = c[2] != null ? `${Math.max(0, c[2] * 0.621).toFixed(1)} mi deep` : "";
    return {id: "eq:" + f.id, level: m >= 4.5 ? 3 : m >= 3.5 ? 2 : 1, time: p.time,
      title: `M${m.toFixed(1)} earthquake · ${away(c[1], c[0])}`,
      meta: [ago(p.time), near ? "near " + near : "", p.felt ? `${p.felt} felt it` : ""].filter(Boolean).join(" · "),
      detail: [
        {p: `Magnitude ${m.toFixed(1)}${depth ? ", " + depth : ""}, ${away(c[1], c[0])} of downtown Salt Lake City${near ? " near " + near : ""}.`},
        {p: `${fmt(p.time, {weekday: "long", month: "short", day: "numeric", hour: "numeric", minute: "2-digit"})}.${p.felt ? ` ${p.felt} people reported feeling it.` : ""}`}
      ], link: p.url, linkLabel: "USGS"};
  }).filter(Boolean);
}

    where: "IncidentTypeCategory='WF'", geometry: `${HOME.lon},${HOME.lat}`, geometryType: "esriGeometryPoint", inSR: "4326",
    spatialRel: "esriSpatialRelIntersects", distance: String(RADIUS_MI), units: "esriSRUnit_StatuteMile",
    outFields: "*", returnGeometry: "true", outSR: "4326", f: "json"});

const acres = v => v == null ? "" : (v < 10 ? Number(v).toFixed(1) : Math.round(v).toLocaleString("en-US")) + " acres";
function parseFires(j){
  if (j && j.error) throw new Error(j.error.message || "query failed");
  if (!j || !Array.isArray(j.features)) throw new Error("unexpected response");
  return j.features.map(f => {
    const a = f.attributes || {}, g = f.geometry || {};
    if (a.FireOutDateTime || a.PercentContained >= 100 || g.y == null) return null;
    const d = miles(g.y, g.x), pc = a.PercentContained, name = String(a.IncidentName || "Unnamed").trim();
    const county = a.POOCounty ? a.POOCounty + " County" : "";
    return {id: "wf:" + (a.UniqueFireIdentifier || name), level: d <= 15 && !(pc >= 50) ? 3 : d <= 35 ? 2 : 1,
      time: a.FireDiscoveryDateTime || 0,
      title: `${/fire$/i.test(name) ? name : name + " Fire"} · ${away(g.y, g.x)}`,
      meta: [acres(a.IncidentSize), pc != null ? pc + "% contained" : "", county].filter(Boolean).join(" · "),
      detail: [
        {p: `${acres(a.IncidentSize) || "Size not reported"}, ${pc != null ? pc + "% contained" : "containment not reported"}. ${away(g.y, g.x)} of downtown Salt Lake City${county ? ", in " + county : ""}.`},
        {p: [a.FireDiscoveryDateTime ? "Discovered " + stamp(a.FireDiscoveryDateTime) : "", a.ModifiedOnDateTime_dt ? "updated " + stamp(a.ModifiedOnDateTime_dt) : ""].filter(Boolean).join(" · ")}
      ].filter(b => b.p), link: "https://utahfireinfo.gov/", linkLabel: "Utah Fire Info"};
  }).filter(Boolean);
}

function localHour(ms){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", {timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", hourCycle: "h23"}).formatToParts(new Date(ms)).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}T${p.hour}:00`;
}
const AQI_CAT = [[301, "Hazardous air"], [201, "Very unhealthy air"], [151, "Unhealthy air"], [101, "Unhealthy air for sensitive groups"]];
const aqiCat = v => (AQI_CAT.find(x => v >= x[0]) || [0, "Moderate air"])[1];
function parseAir(j){
  const h = (j && j.hourly) || {}, t = h.time || [], a = h.us_aqi || [];
  if (!t.length) throw new Error("unexpected response");
  const curT = (j.current && j.current.time) || localHour(Date.now());
  let i0 = 0; t.forEach((x, i) => { if (x <= curT) i0 = i; });
  let mi = -1;
  for (let i = i0; i < Math.min(t.length, i0 + 25); i++) if (a[i] != null && (mi < 0 || a[i] > a[mi])) mi = i;
  const now = (j.current && j.current.us_aqi != null) ? j.current.us_aqi : a[i0];
  const peak = mi >= 0 ? a[mi] : null, top = Math.max(now ?? 0, peak ?? 0);
  if (top < 101) return [];
  const pol = i => (((h.us_aqi_ozone || [])[i] ?? 0) > ((h.us_aqi_pm2_5 || [])[i] ?? 0)) ? "ozone" : "fine particles (PM2.5)";
  const at = s => { const hr = +s.slice(11, 13), lbl = (hr % 12 || 12) + (hr < 12 ? " AM" : " PM"); return s.slice(0, 10) === curT.slice(0, 10) ? lbl : lbl + " tomorrow"; };
  const nowBad = (now ?? 0) >= 101;
  const title = aqiCat(nowBad ? now : peak);
  const meta = nowBad
    ? `Now · AQI ${now} · ${pol(i0).split(" ")[0]}` + (peak > now ? ` · peak ${peak} around ${at(t[mi])}` : "")
    : `Expected around ${at(t[mi])} · AQI ${peak} · ${pol(mi).split(" ")[0]}`;
  return [{id: "air", level: top >= 201 ? 3 : top >= 151 ? 2 : 1, time: Date.now(), title, meta,
    detail: [
      {p: nowBad ? `Air quality index ${now} now, mainly from ${pol(i0)}.` : `Air quality index forecast to reach ${peak} around ${at(t[mi])}, mainly from ${pol(mi)}.`},
      {p: "People with heart or lung conditions, older adults and children should cut back on long or heavy exertion outdoors while the index is above 100."},
      {small: "Forecast from the Copernicus (CAMS) air quality model via Open-Meteo for downtown Salt Lake City. Utah DEQ has official readings and action days."}
    ], link: "https://air.utah.gov/", linkLabel: "Utah DEQ"}];
}

/* ---------- state, rendering ---------- */
const state = {tab: "now", items: {}, src: {}, busy: false, checked: 0, view: [], sheetView: []};
try { const t = localStorage.getItem("slcw-tab"); if (SCOPE[t]) state.tab = t; } catch (e) {}

const all = () => Object.values(state.items).flat();
const forTab = tab => all().filter(i => tab === "now" || i.tab === tab).sort((a, b) => b.level - a.level || (b.time || 0) - (a.time || 0));
const known = s => !!state.src[s.key] && state.src[s.key].ok !== undefined;   // has answered at least once
const isDown = s => known(s) && !state.src[s.key].ok;
const LEVEL_COLOR = ["var(--line)", "var(--sev1)", "var(--sev2)", "var(--sev3)"];
const card = (it, i) => `<li><button class="item l${it.level}" type="button" data-i="${i}"><span class="tx"><span class="t">${esc(it.title)}</span><span class="m">${esc(it.meta)}</span></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></li>`;

function renderStatus(dn, wait){
  const n = SOURCES.length, at = state.checked ? " · " + clock(state.checked) : "";
  $("#status").className = wait ? "" : dn.length ? "down" : "up";
  $("#stext").textContent = wait ? `Checking sources… ${n - wait} of ${n}`
    : !dn.length ? `All ${n} sources up${at}`
    : dn.length === n ? `All sources down${at}`
    : `${dn.length} down: ${dn.map(s => s.short).join(", ")}${at}`;
}

function render(){
  const items = all(), top = items.reduce((m, i) => Math.max(m, i.level), 0);
  const dn = SOURCES.filter(isDown), wait = SOURCES.filter(s => !known(s)).length;
  $("#dot").style.background = items.length ? LEVEL_COLOR[top] : "var(--line)";
  $("#headline").textContent = items.length ? `${items.length} flagged` : wait ? "Checking…" : dn.length === SOURCES.length ? "No data" : "Nothing flagged";
  $("#refresh").classList.toggle("spin", state.busy);
  renderStatus(dn, wait);

  document.querySelectorAll("#tabs button").forEach(b => {
    const t = b.dataset.tab, list = forTab(t);
    b.setAttribute("aria-selected", String(t === state.tab));
    let badge = b.querySelector(".badge");
    if (t !== "now" && list.length){
      if (!badge){ badge = document.createElement("span"); b.append(badge); }
      badge.className = "badge l" + list[0].level;
      badge.textContent = list.length;
    } else if (badge) badge.remove();
  });

  const view = state.view = forTab(state.tab);
  $("#list").innerHTML = view.map(card).join("");
  const srcs = SOURCES.filter(s => state.tab === "now" || s.tabs.includes(state.tab));
  const failed = srcs.filter(isDown), waiting = srcs.some(s => !known(s));
  $("#empty").hidden = view.length > 0;
  if (!view.length){
    const none = !waiting && failed.length === srcs.length;
    $("#emptyTitle").textContent = waiting ? "Checking…" : none ? `Couldn't load ${state.tab === "now" ? "any source" : join(failed.map(s => s.name))}` : "Nothing flagged";
    $("#emptyText").textContent = waiting ? ""
      : none ? "Tap the source status at the top for details, then try refresh."
      : failed.length ? `${cap(join(failed.map(s => s.name)))} didn't load, so this may be incomplete.`
      : SCOPE[state.tab];
  }
  fit();
  if (!$("#sheet").hidden && $("#panel .srcs")) openSources();   // keep an open source list current
  else updateDebug();                                             // or an open debug report
}

/* Keep everything on one screen: hide the lowest-priority cards behind "+N more". */
function fit(){
  const main = $("#main"), more = $("#more"), cards = [...$("#list").children];
  more.hidden = true;
  let hidden = 0;
  for (let i = cards.length - 1; i > 0 && main.scrollHeight > main.clientHeight + 1; i--){
    cards[i].hidden = true; hidden++;
    more.hidden = false; more.textContent = `+${hidden} more`;
  }
}

function showSheet(html){ $("#panel").innerHTML = html; $("#sheet").hidden = false; $("#panel").scrollTop = 0; }
const closeSheet = () => { $("#sheet").hidden = true; };
const CLOSE = `<button class="btn" type="button" data-close>Close</button>`;
function openDetail(it){
  const blocks = (it.detail || []).map(b => b.k ? `<div class="k">${esc(b.k)}</div>` : b.small ? `<p class="small">${esc(b.small)}</p>` : `<p${b.lead ? ' class="lead"' : ""}>${esc(b.p)}</p>`).join("");
  const link = /^https:\/\//.test(it.link || "") ? `<a class="btn go" href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">Open ${esc(it.linkLabel || "source")}</a>` : "";
  showSheet(`<h2>${esc(it.title)}</h2><div class="sub">${esc(it.meta)}</div>${blocks}<div class="row">${link}${CLOSE}</div>`);
}
function openAll(){
  state.sheetView = state.view.slice();
  showSheet(`<h2>${esc(TITLES[state.tab])}</h2><ul class="cards">${state.sheetView.map(card).join("")}</ul><div class="row">${CLOSE}</div>`);
}
function openSources(){
  const rows = SOURCES.map(s => {
    const st = state.src[s.key] || {}, wait = st.busy || st.ok === undefined;
    const line = wait ? `Checking… · ${s.provider}`
      : st.ok ? `Up · ${s.provider}`
      : `Down: ${st.err}${st.okAt ? " · last worked " + when(st.okAt) : ""} · ${s.provider}`;
    return `<li><i class="${wait ? "" : st.ok ? "up" : "down"}"></i><div><b>${esc(s.label)}</b><span>${esc(line)}</span></div></li>`;
  }).join("");
  const sub = state.busy ? "Checking now" : state.checked ? `Checked ${clock(state.checked)} · rechecks every 5 minutes while open` : "";
  const note = SOURCES.some(isDown) ? `<p class="small">A source marked down didn't answer in a usable way, usually because the provider is busy or limiting requests. The rest of the page still works, and it tries again on the next check.</p>` : "";
  showSheet(`<h2>Sources</h2><div class="sub">${esc(sub)}</div><ul class="srcs">${rows}</ul>${note}<div class="row"><button class="btn go" type="button" data-recheck${state.busy ? " disabled" : ""}>${state.busy ? "Checking…" : "Check again"}</button>${CLOSE}</div><button class="dbglink" type="button" data-debug>Debug info</button>`);
}

/* ---------- fetching (every request is noted for the debug report) ---------- */
const kb = n => n < 1024 ? n + " B" : (n / 1024).toFixed(1) + " KB";
const count = j => !j || typeof j !== "object" ? "no data" : Array.isArray(j.articles) ? j.articles.length + " articles"
  : Array.isArray(j.features) ? j.features.length + " records" : Object.keys(j).length + " fields";
const snippet = t => String(t).replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
async function getJSON(url, ms, tag){
  const t0 = Date.now(), ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), ms || 15000);
  let r, text;
  try {
    r = await fetch(url, {signal: ctl.signal, cache: "no-store"});
    text = await r.text();
  } catch (e) {
    note(tag, "fetch", t0, `${e.name}: ${e.message}`);
    if (e.name === "AbortError") throw new Error("timed out");
    const code = /status code:?\s*(\d{3})/i.exec(e.message || "");   // Safari names the status when it blocks an unreadable reply
    throw new Error(!code ? "unreachable or blocked" : code[1] === "429" ? "rate limited" : "HTTP " + code[1]);
  } finally { clearTimeout(timer); }
  let j = null;
  if (!text.trim()) j = {};
  else try { j = JSON.parse(text); } catch (e) {
    // GDELT occasionally sends stray control characters or bad escapes inside titles
    try { j = JSON.parse(text.replace(/[\u0000-\u001f]+/g, " ").replace(/\\'/g, "'").replace(/\\(?!["\\\/bfnrtu])/g, "\\\\")); } catch (e2) {}
  }
  note(tag, "fetch", t0, `HTTP ${r.status} · ${r.headers.get("content-type") || "no type"} · ${kb(text.length)} · ` + (j ? count(j) : `reply "${snippet(text).slice(0, 90)}"`));
  if (!r.ok) throw new Error(r.status === 429 ? "rate limited" : "HTTP " + r.status);
  if (j) return j;
  const reply = snippet(text);
  const err = new Error(/limit requests/i.test(reply) ? "rate limited" : `unexpected reply: "${reply.slice(0, 70)}"`);
  err.reply = reply;
  throw err;
}
/* Script-tag request (JSONP): works even when a reply lacks the header that lets pages read it with fetch. */
let jsonpN = 0;
function jsonp(url, ms, tag){
  return new Promise((resolve, reject) => {
    const t0 = Date.now(), cb = "slcwCb" + (++jsonpN) + t0.toString(36), s = document.createElement("script");
    let done = false, timer;
    const end = (err, data) => {
      if (done) return;
      done = true; clearTimeout(timer); s.remove();
      window[cb] = () => {};   // a late reply must not throw
      note(tag, "script", t0, err || "callback · " + count(data));
      err ? reject(new Error(err)) : resolve(data && typeof data === "object" ? data : {});
    };
    timer = setTimeout(() => end("timed out"), ms);
    window[cb] = data => end(null, data);
    s.onerror = () => end("unreachable or blocked");   // an HTTP error status, or no connection
    s.onload = () => setTimeout(() => end("sent an error instead of results"), 0);   // loaded but never called back
    s.referrerPolicy = "no-referrer";
    s.src = url + "&callback=" + cb;
    document.head.append(s);
  });
}
async function check(){
  if (state.busy) return;
  state.busy = true; dbg.checks++;
  SOURCES.forEach(s => { (state.src[s.key] || (state.src[s.key] = {})).busy = true; });
  render();
  await Promise.all(SOURCES.map(async s => {
    const st = state.src[s.key];
    try {
      const items = s.load ? await s.load() : s.parse(await getJSON(s.url(), 0, s.key));
      items.forEach(i => { if (!i.tab) i.tab = s.tabs[0]; });
      state.items[s.key] = items;
      Object.assign(st, {ok: true, okAt: Date.now(), err: ""});
    } catch (err) {
      Object.assign(st, {ok: false, err: err.message || "failed"});  // keep the last good results for this source
      console.warn(s.label, err);
    }
    st.busy = false;
    render();   // show each source as soon as it answers
  }));
  state.busy = false; state.checked = Date.now();
  render();
}

/* ---------- debug report (Sources → Debug info) ---------- */
const BUILD = "2026-10-04 19:45Z 092d1c3";
const dbg = {log: [], errors: [], opened: Date.now(), checks: 0, test: null};
const hms = ms => new Date(ms).toLocaleTimeString("en-GB", {hour12: false});
function note(tag, kind, t0, result){
  dbg.log.push({t0, ms: Date.now() - t0, tag: tag || "-", kind, result});
  if (dbg.log.length > 60) dbg.log.shift();
  updateDebug();
}
addEventListener("error", e => { dbg.errors.push(`${hms(Date.now())} ${e.message || "error"}${e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : ""}`); if (dbg.errors.length > 20) dbg.errors.shift(); });
addEventListener("unhandledrejection", e => { dbg.errors.push(`${hms(Date.now())} unhandled: ${(e.reason && e.reason.message) || e.reason}`); });
function debugReport(){
  const app = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  let store = "ok"; try { localStorage.setItem("slcw-t", "1"); localStorage.removeItem("slcw-t"); } catch (e) { store = "blocked"; }
  const L = [
    `SLCo Watch debug · build ${BUILD}`,
    `Report ${new Date().toISOString()} · opened ${hms(dbg.opened)} · checks ${dbg.checks}${state.busy ? " (one running)" : ""}`,
    `${app ? "Home-screen app" : "Browser tab"} · online ${navigator.onLine} · storage ${store} · ${location.host}${location.pathname}`,
    `Screen ${innerWidth}x${innerHeight} @${devicePixelRatio}x · ${Intl.DateTimeFormat().resolvedOptions().timeZone} · ${navigator.language}`,
    navigator.userAgent, "", "Sources:"
  ];
  for (const s of SOURCES){
    const x = state.src[s.key] || {};
    L.push(`  ${s.key.padEnd(6)} ${x.busy ? "checking" : x.ok === undefined ? "not yet" : x.ok ? "up" : "DOWN: " + x.err} · ${(state.items[s.key] || []).length} flagged${x.okAt ? " · last ok " + hms(x.okAt) : ""}`);
  }
  L.push(`  news query: ${newsMode} · script format: ${gdeltScript ? "in use" : "not used"}`, "", "GDELT test:");
  if (!dbg.test) L.push("  not run");
  else { dbg.test.lines.forEach(x => L.push("  " + x)); if (dbg.test.running) L.push("  running…"); }
  L.push("", "Requests (oldest first):");
  dbg.log.forEach(e => L.push(`  ${hms(e.t0)} ${e.tag.padEnd(11)} ${e.kind.padEnd(6)} ${String(e.ms).padStart(5)}ms  ${e.result}`));
  if (dbg.errors.length){ L.push("", "Page errors:"); dbg.errors.forEach(x => L.push("  " + x)); }
  return L.join("\n");
}
function openDebug(){
  showSheet(`<h2>Debug info</h2><div class="sub" id="dbgSub"></div><pre id="dbg"></pre><div class="row"><button class="btn go" type="button" data-copy>Copy</button>${CLOSE}</div>`);
  runTest();
  updateDebug();
}
function updateDebug(){
  const pre = document.getElementById("dbg");
  if (!pre || $("#sheet").hidden) return;
  const top = pre.scrollTop;
  pre.textContent = debugReport();
  pre.scrollTop = top;
  $("#dbgSub").textContent = dbg.test && dbg.test.running ? "Testing the news source, up to a minute…" : "Done. Tap Copy, then paste it into the chat.";
}
/* From this device: a minimal query read normally and as a script, to see whether GDELT lets pages read a plain reply.
   Through a public relay (allorigins.win): the real queries, to see GDELT's actual status, timing and reply text from
   outside this network. The relay is only used here, never for the dashboard itself. */
const RELAY = "https://api.allorigins.win/get?url=";
async function runTest(){
  if (dbg.test && dbg.test.running) return;
  const T = dbg.test = {running: true, lines: []}, add = x => { T.lines.push(x); updateDebug(); };
  const timed = async fn => { const t0 = Date.now(); try { return [await fn(), Date.now() - t0]; } catch (e) { return [e, Date.now() - t0]; } };
  const limit = ms => { const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; };
  const show = (r, ms) => `${String(ms).padStart(5)}ms  ${r instanceof Error ? (r.name === "Error" ? "" : r.name + ": ") + r.message : r}`;
  const body = t => { try { return count(JSON.parse(t)); } catch (e) { return `reply "${snippet(t).slice(0, 160)}"`; } };
  const direct = (async () => {
    const one = q => gdeltUrl(q, "json", 5);
    await gdeltTurn();
    const [a, msA] = await timed(async () => {
      const r = await fetch(one("domain:ksl.com"), {cache: "no-store", signal: limit(20000)}), t = await r.text();
      return `HTTP ${r.status} · ${r.headers.get("content-type") || "no type"} · ${body(t)}`;
    });
    add(`D1 phone fetch  minimal query ${show(a, msA)}`);
    await gdeltTurn();
    const [b, msB] = await timed(() => jsonp(gdeltUrl("domain:ksl.com", "jsonp", 5), 20000, "test").then(j => "callback · " + count(j)));
    add(`D2 phone script minimal query ${show(b, msB)}`);
  })();
  const relayed = (async () => {
    for (const [name, q, max] of [["old query", NEWS_QUERY.local, 5], ["new query", NEWS_QUERY.sites, 250]]){
      const [r, ms] = await timed(async () => {
        const res = await fetch(RELAY + encodeURIComponent(gdeltUrl(q, "json", max)), {cache: "no-store", signal: limit(40000)});
        if (!res.ok) throw new Error("relay HTTP " + res.status);
        const j = await res.json(), st = j.status || {};
        return `GDELT HTTP ${st.http_code ?? "?"} · ${st.content_type || "no type"}${st.response_time != null ? " · GDELT took " + st.response_time + "ms" : ""} · ${body(j.contents || "")}`;
      });
      add(`R  relay ${name.padEnd(13)}  ${show(r, ms)}`);
      await sleep(5500);
    }
  })();
  await Promise.all([direct, relayed]);
  T.running = false; updateDebug();
}
async function copyDebug(btn){
  const text = debugReport();
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
    document.body.append(ta); ta.select(); ta.setSelectionRange(0, text.length);
    try { ok = document.execCommand("copy"); } catch (e2) {}
    ta.remove();
  }
  btn.textContent = ok ? "Copied" : "Couldn't copy: select the text";
  setTimeout(() => { if (btn.isConnected) btn.textContent = "Copy"; }, 2500);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const tab = e.target.closest("#tabs button");
  if (tab){ state.tab = tab.dataset.tab; try { localStorage.setItem("slcw-tab", state.tab); } catch (err) {} render(); return; }
  const item = e.target.closest(".item");
  if (item){ const it = (item.closest("#panel") ? state.sheetView : state.view)[+item.dataset.i]; if (it) openDetail(it); return; }
  if (e.target.closest("#more")){ openAll(); return; }
  if (e.target.closest("#status")){ openSources(); return; }
  if (e.target.closest("[data-recheck]")){ check(); return; }
  if (e.target.closest("[data-debug]")){ openDebug(); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp){ copyDebug(cp); return; }
  if (e.target.closest("#refresh")){ check(); return; }
  if (e.target.closest("[data-close]") || e.target.id === "sheet") closeSheet();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
let rz;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 150); });
setInterval(() => { if (document.visibilityState === "visible") check(); }, 5 * 60e3);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - state.checked > 2 * 60e3) check();
});

render();
check();
</script>
</body>
</html>
